name: Code Lint

on:
  push:
    branches: [ main ]
  
jobs:
  
  code-linter:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name : setup python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: code linter
        run: ruff check .
